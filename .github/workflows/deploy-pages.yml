name: Deploy to GitHub Pages

# Builds the static game and publishes it to the gh-pages branch (served by
# Pages: Settings → Pages → Source "Deploy from a branch: gh-pages /"). Pushes
# to a branch via peaceiris rather than the flaky actions/deploy-pages API.
#
# Pages is the MIRROR. The canonical deployment is the Bulletin chain
# (.github/workflows/deploy-bulletin.yml) — but Bulletin content is immutable per
# CID and expires unless renewed, so this always-available mirror stays.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test          # the Sokoban floors are only as good as their replay fixtures
      - run: npm run build:pages
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
